<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <link rel="stylesheet" href="Student.css">

    <title>Student Result Manager</title>
</head>

<body>

    <form class="form">

        <h1 id="heading">Student Result</h1>

        Name:
        <input type="text" placeholder="Enter your name">

        Roll No:
        <input type="number" placeholder="Enter your roll no.">

        Maths:
        <input type="number" placeholder="Math number" id="math">

        Physics:
        <input type="number" placeholder="Physics number" id="physics">

        Chemistry:
        <input type="number" placeholder="Chemistry number" id="chemistry">

        English:
        <input type="number" placeholder="English number" id="english">

        Hindi:
        <input type="number" placeholder="Hindi number" id="hindi">

        <button type="button" id="calculateBtn">
            Calculate Result
        </button>

        <section class="result">

            <p id="total">
                <span>Total:</span>
            </p>

            <p id="percentage">
                <span>Percentage:</span>
            </p>

            <p id="grade">
                <span>Grade:</span>
            </p>

            <p id="result">
                <span>Result:</span>
            </p>

        </section>

    </form>

    <script src="Student.js"></script>

</body>

</html>
