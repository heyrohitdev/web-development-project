<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Daily Task Manager</title>

    <!-- Font Awesome  -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/7.3.1/css/all.css"
        integrity="sha512-x9WwyMYBnlXMNQ6kQ/Lyzu1NqIhLQKL5Oq6xByfXuRj7s9CskyCbLv/1IjqzJmXwFXWr0ov6jBV7Qbc0hh9nHg=="
        crossorigin="anonymous" referrerpolicy="no-referrer">

    <!-- Google Fonts -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>  
    <link
        href="https://fonts.googleapis.com/css2?family=Open+Sans:ital,wght@0,300..800;1,300..800&family=Rye&display=swap"
        rel="stylesheet">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>


    <link href="https://fonts.googleapis.com/css2?family=Metal+Mania&display=swap" rel="stylesheet">

    <!-- Custom CSS  -->
    <link rel="stylesheet" href="style.css">
</head>

<body>
    <div class="container">

        <!-- Header  -->
        <header class="header">
            <h1 id="title"><i class="fa-regular fa-square-check"></i> Daily Task Manager</h1>

            <p id="subTitle">
                Stay organized and productive with your daily tasks
            </p>
        </header>

        <div class="content">

            <section id="result">
                <div class="score">
                    <strong class="totalCount">0</strong>
                    <span>Total Tasks</span>
                </div>

                <div class="score">
                    <strong class="activeCount">0</strong>
                    <span>Active</span>
                </div>

                <div class="score">
                    <strong class="completedCount">0</strong>
                    <span>Completed</span>
                </div>

                <div class="score">
                    <strong id="progressCount">0%</strong>
                    <span>Progress</span>
                </div>
            </section>

            <!-- Add Task Button  -->
            <button class="btn" id="addTaskBtn">
                <i class="fa-solid fa-plus"></i>
                Add New Task
            </button>

            <!-- Task Form  -->
            <div class="form hidden">
                <h2>Add New Task</h2>

                <p>Task Title</p>
                <input type="text" placeholder="Enter task title..." id="taskTitle" required>

                <p>Desciption</p>
                <input type="text" placeholder="Enter task description..." id="taskDescription" required>

                <div class="select">

                    <section>
                        <p>Category</p>
                        <select name="category" id="taskCategory">
                            <option value="Study">Study</option>
                            <option value="Coding">Coding</option>
                            <option value="Personal">Personal</option>
                            <option value="Other">Other</option>
                        </select>
                    </section>

                    <section>
                        <p>Priority</p>
                        <select name="priority" id="taskPriority">
                            <option value="Low">Low</option>
                            <option value="Medium">Medium</option>
                            <option value="High">High</option>
                        </select>
                    </section>
                </div>

                <p>Due Date</p>
                <input type="date" id="taskDate">

                <div class="btn">
                    <button id="saveBtn">Save Task</button>
                    <button id="cancelBtn">Cancel</button>
                </div>
            </div>

            <section class="addTask">

                <div class="searchbar">
                    <div class="searchIcon"><i class="fa-solid fa-magnifying-glass"></i></div>
                    
                    <input type="text" id="searchInput" placeholder="Search tasks...">
                </div>

                <span><i class="fa-solid fa-filter"></i></span>

                <button class="allTask" id="allTaskBtn">
                    All Tasks <span class="totalCount">0</span>
                </button>

                <button class="allTask" id="activeBtn">
                    Active <span class="activeCount">0</span>
                </button>

                <button class="allTask" id="completeBtn">
                    Completed <span class="completedCount">0</span>
                </button>

            </section>

            <!-- Task List  -->
            <ul id="list"></ul>

        </div>
    </div>

    <!-- Custom JavaScript -->
    <script src="script.js"></script>
</body>

</html>
